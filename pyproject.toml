[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celltypepilot"
version = "0.3.0"
description = "Local-first single-cell annotation review plugin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CellTypePilot Contributors" }]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
report = ["python-docx>=1.0.0"]
web = ["flask>=3.0.0"]
seurat = ["rpy2>=3.5.0"]
reference = ["celltypist>=1.6.0"]
embedding = ["scvi-tools>=1.0.0"]
all = [
    "python-docx>=1.0.0",
    "flask>=3.0.0",
    "rpy2>=3.5.0",
    "celltypist>=1.6.0",
    "scvi-tools>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "coverage>=7.0.0",
]

[project.scripts]
celltypepilot = "celltypepilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/celltypepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=celltypepilot",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/celltypepilot"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "src/celltypepilot/seurat_adapter.py",
    "src/celltypepilot/web_inspector.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "N806",  # uppercase locals: scientific convention (X matrices, constants)
]

[tool.ruff.lint.isort]
known-first-party = ["celltypepilot"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
